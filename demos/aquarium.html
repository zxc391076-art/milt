<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Аквариум — живая 3D-сцена</title>
<meta name="description" content="3D-аквариум в реальном времени: рыбки, растения, каустика и мягкий свет. WebGL-сцена на Three.js.">
<meta name="theme-color" content="#020507">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="aquarium.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23020507'/%3E%3Cpath d='M14 32c8-11 26-13 34 0-8 13-26 11-34 0Z' fill='%235eead4'/%3E%3Ccircle cx='41' cy='29' r='2.4' fill='%23020507'/%3E%3C/svg%3E">
</head>
<body>

<div class="loader" id="loader" aria-hidden="true">
  <div class="loader-word">AQUARIUM</div>
  <div class="loader-line"><i></i></div>
  <div class="loader-note">наполняем водой…</div>
</div>

<canvas id="tank" aria-label="Трёхмерный аквариум с рыбками и растениями"></canvas>

<div class="vignette" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <a class="brand" href="../index.html">
    <span class="mark" aria-hidden="true"></span>
    <span class="brand-text">Aquarium</span>
  </a>

  <div class="status" aria-hidden="true">
    <span class="live"><i></i>Live</span>
    <span class="sep"></span>
    <span>14 рыб</span>
    <span class="sep"></span>
    <span>24.0 °C</span>
  </div>

  <a class="pill small" href="../index.html">Портфолио ↗</a>
</header>

<footer class="hud">
  <div class="caption">
    <span class="label">3D · Real-time</span>
    <h1>Тихая<br>экосистема.</h1>
    <p>Живая сцена на WebGL. Покормите рыб или просто наблюдайте.</p>
  </div>

  <div class="actions">
    <span class="hint">клик по воде — корм</span>
    <button class="pill feed" id="feedBtn" type="button">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 12c3.5-5 10.5-6 15 0-4.5 6-11.5 5-15 0Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M18 12l3-2.5v5L18 12Z" fill="currentColor"/>
        <circle cx="14.2" cy="10.6" r="1" fill="currentColor"/>
      </svg>
      Покормить
    </button>
  </div>
</footer>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>
<script type="module" src="aquarium.js?v=9"></script>

</body>
</html>
