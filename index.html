<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>milt — contacts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Подключил Space Mono для времени и Inter/Space Grotesk для остального -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg: #0a0a0f;
    --bg-soft: #13131c;
    --card: #1a1a26;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.22);
    --text: #f5f5f8;
    --muted: #85859a;
    --dim: #3a3a48;
    --accent: #a855f7;      /* фиолетовый */
    --accent-2: #22d3ee;    /* голубой */
    --accent-3: #f472b6;    /* розовый */
    --tg: #2AABEE;
    --ds: #5865F2;
    --green: #22c55e;
    --red: #ef4444;
}

body.light {
    --bg: #f9f9fb;
    --bg-soft: #ffffff;
    --card: #ffffff;
    --border: rgba(0,0,0,0.08);
    --border-hover: rgba(0,0,0,0.22);
    --text: #14141a;
    --muted: #6b6b7a;
    --dim: #d0d0d8;
}

html, body { min-height: 100vh; }

body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    transition: background 0.4s, color 0.4s;
    position: relative;
}

/* Яркая фоновая сетка с градиентным свечением */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse at 50% 30%, black 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 30%, black 30%, transparent 80%);
    opacity: 0.6;
    pointer-events: none;
    z-index: 0;
}

/* Курсорное свечение */
.cursor-glow {
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(168,85,247,0.15) 0%, transparent 65%);
    pointer-events: none;
    transform: translate(-50%, -50%);
    transition: opacity 0.3s;
    z-index: 0;
    opacity: 0;
}
body:hover .cursor-glow { opacity: 1; }

/* Верхняя панель */
.topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 20px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
    backdrop-filter: blur(16px);
    background: linear-gradient(to bottom, var(--bg) 0%, transparent 100%);
    transition: background 0.4s;
}

.logo {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text);
    text-decoration: none;
}
.logo-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 12px var(--green);
    animation: blink 2s ease-in-out infinite;
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.top-actions { display: flex; gap: 10px; align-items: center; }

/* БЛОК ЧАСОВ (обновлён) */
.clock {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    letter-spacing: 0.5px;
    background: var(--bg-soft);
    transition: all 0.3s;
    display: flex;
    align-items: center;
    gap: 8px;
}
.clock svg {
    width: 14px;
    height: 14px;
    fill: var(--accent-2);
    filter: drop-shadow(0 0 4px var(--accent-2));
}

.icon-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    color: var(--muted);
    display: grid; place-items: center;
    cursor: pointer;
    transition: all 0.25s ease;
}
.icon-btn:hover {
    color: var(--text);
    border-color: var(--border-hover);
    transform: scale(1.06);
}
.icon-btn svg { width: 16px; height: 16px; fill: currentColor; }

/* Основная сетка */
.page {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    max-width: 1280px;
    margin: 0 auto;
    padding: 100px 48px 60px;
    gap: 64px;
    align-items: center;
    position: relative;
    z-index: 1;
}

/* ЛЕВАЯ КОЛОНКА */
.left { display: flex; flex-direction: column; align-items: flex-start; gap: 28px; }

/* Аватар */
.avatar-container {
    position: relative;
    width: 150px; height: 150px;
    animation: float 6s ease-in-out infinite;
}
@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}

/* Более яркое и цветное кольцо вокруг аватара */
.avatar-ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent));
    animation: spin 6s linear infinite;
    filter: blur(2px);
    opacity: 1;
}
@keyframes spin { to { transform: rotate(360deg); } }

.avatar-inner {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 56px;
    color: #fff;
    overflow: hidden;
    cursor: pointer;
    background-size: cover;
    background-position: center;
    z-index: 2;
    transition: transform 0.3s;
}
.avatar-inner:hover { transform: scale(1.03); }
.avatar-inner.has-image { font-size: 0; }

.avatar-overlay {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(0,0,0,0.7);
    display: grid; place-items: center;
    color: #fff;
    opacity: 0;
    transition: opacity 0.25s;
    z-index: 3;
    pointer-events: none;
}
.avatar-container:hover .avatar-overlay { opacity: 1; }
.avatar-overlay-content {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-align: center;
}
.avatar-overlay svg { width: 28px; height: 28px; fill: #fff; }

.online-dot {
    position: absolute;
    bottom: 8px; right: 8px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--green);
    border: 3px solid var(--bg);
    box-shadow: 0 0 12px var(--green);
    z-index: 4;
    transition: border-color 0.4s;
}

#avatarInput { display: none; }

/* Кнопка сброса аватара */
.avatar-reset {
    position: absolute;
    top: -6px; right: -6px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    display: grid; place-items: center;
    cursor: pointer;
    z-index: 5;
    transition: all 0.25s;
    opacity: 0;
    transform: scale(0.8);
    pointer-events: none;
}
.avatar-container:hover .avatar-reset.active {
    opacity: 1; transform: scale(1); pointer-events: auto;
}
.avatar-reset:hover {
    color: var(--red);
    border-color: rgba(239,68,68,0.4);
    background: rgba(239,68,68,0.1);
}
.avatar-reset svg { width: 14px; height: 14px; fill: currentColor; }

/* Заголовок */
.greeting {
    font-size: 13px; color: var(--muted); font-weight: 500;
    letter-spacing: 0.5px; text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
}
.greeting::before {
    content: ''; width: 24px; height: 1px; background: var(--muted);
}

.title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(48px, 7vw, 82px);
    font-weight: 700;
    letter-spacing: -3px;
    line-height: 0.95;
    margin-top: -8px;
}
/* Более яркий градиент для заголовка */
.title .highlight {
    background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-style: italic;
}

.description {
    font-size: 15px; color: var(--muted); line-height: 1.65;
    max-width: 420px;
}

.status-pill {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 500;
    color: var(--text);
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--bg-soft);
}
.status-pill .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: blink 2s ease-in-out infinite;
}

/* ПРАВАЯ КОЛОНКА */
.right { display: flex; flex-direction: column; gap: 16px; }

.section-label {
    font-size: 11px; color: var(--muted);
    letter-spacing: 2px; text-transform: uppercase; font-weight: 500;
    margin-bottom: 4px;
}

/* Кнопки контактов */
.contact {
    position: relative;
    display: flex; align-items: center; gap: 18px;
    padding: 22px 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    text-decoration: none;
    color: var(--text);
    transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    overflow: hidden;
    animation: slideIn 0.7s ease-out both;
}
.contact:nth-child(2) { animation-delay: 0.1s; }
.contact:nth-child(3) { animation-delay: 0.2s; }

@keyframes slideIn {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
}

.contact:hover {
    border-color: var(--border-hover);
    transform: translateX(-6px);
    background: var(--bg-soft);
}

.contact .icon-large {
    width: 52px; height: 52px;
    border-radius: 16px;
    display: grid; place-items: center;
    flex-shrink: 0; position: relative; z-index: 2;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}
.contact .icon-large svg { width: 26px; height: 26px; fill: #fff; }

.contact.tg .icon-large { background: linear-gradient(135deg, #2AABEE, #22d3ee); box-shadow: 0 8px 24px rgba(34,211,238,0.4); }
.contact.ds .icon-large { background: linear-gradient(135deg, #5865F2, #a855f7); box-shadow: 0 8px 24px rgba(168,85,247,0.4); }

.contact:hover .icon-large { transform: rotate(-8deg) scale(1.08); }

.contact-info { flex: 1; min-width: 0; position: relative; z-index: 2; }
.contact-name { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; margin-bottom: 3px; }
.contact-handle {
    font-family: 'Space Mono', monospace;
    font-size: 12px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.contact-actions { display: flex; gap: 6px; position: relative; z-index: 2; }

.mini-btn {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    display: grid; place-items: center;
    cursor: pointer;
    transition: all 0.2s ease;
    flex-shrink: 0;
}
.mini-btn:hover {
    color: var(--text);
    background: rgba(127,127,127,0.1);
    border-color: var(--border-hover);
    transform: scale(1.05);
}
.mini-btn svg { width: 15px; height: 15px; fill: currentColor; }
.mini-btn.copied {
    color: var(--green);
    border-color: rgba(34,197,94,0.5);
    background: rgba(34,197,94,0.08);
}

.contact .arrow {
    color: var(--muted); font-size: 20px;
    transition: all 0.3s; position: relative; z-index: 2;
}
.contact:hover .arrow { color: var(--text); transform: translateX(4px); }

/* Более яркие hover-градиенты */
.contact::before {
    content: ''; position: absolute; inset: 0;
    opacity: 0; transition: opacity 0.4s;
    pointer-events: none; z-index: 0;
}
.contact.tg::before { background: linear-gradient(90deg, rgba(34,211,238,0.1), transparent 70%); }
.contact.ds::before { background: linear-gradient(90deg, rgba(168,85,247,0.1), transparent 70%); }
.contact:hover::before { opacity: 1; }

/* Нижняя панель */
.bottom-bar {
    display: flex; gap: 10px; margin-top: 8px;
    animation: slideIn 0.7s 0.3s ease-out both;
}

.action-btn {
    flex: 1; padding: 14px;
    border-radius: 14px;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--muted);
    font-family: inherit; font-size: 13px; font-weight: 500;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: all 0.25s ease;
}
.action-btn:hover {
    color: var(--text);
    border-color: var(--border-hover);
    background: var(--bg-soft);
    border-style: solid;
}
.action-btn svg { width: 15px; height: 15px; fill: currentColor; }

/* Footer */
.footer {
    position: fixed;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1.5px;
    opacity: 0.5;
    z-index: 5;
    display: flex; gap: 12px; align-items: center;
    text-transform: uppercase;
}
.footer .sep { opacity: 0.4; }

/* Toast */
.toast {
    position: fixed;
    bottom: 70px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--green);
    color: #fff;
    padding: 12px 22px;
    border-radius: 12px;
    font-size: 13.5px; font-weight: 500;
    box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 100;
    pointer-events: none;
    max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--red); }

/* Конфетти */
.confetti {
    position: fixed;
    width: 10px; height: 10px;
    pointer-events: none;
    z-index: 999;
    animation: confettiFall linear forwards;
}
@keyframes confettiFall {
    to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* Адаптивность */
@media (max-width: 900px) {
    .page {
        grid-template-columns: 1fr;
        padding: 90px 24px 60px;
        gap: 40px;
        text-align: center;
    }
    .left { align-items: center; }
    .description { text-align: center; }
    .title { font-size: clamp(42px, 12vw, 68px); }
    .avatar-container { width: 130px; height: 130px; }
    .topbar { padding: 16px 20px; }
    .footer { font-size: 10px; bottom: 14px; }
    .contact:hover { transform: translateY(-2px); }
}

@media (max-width: 440px) {
    .clock { display: none; }
    .contact { padding: 18px 18px; gap: 14px; border-radius: 18px; }
    .contact .icon-large { width: 46px; height: 46px; border-radius: 14px; }
    .contact .icon-large svg { width: 22px; height: 22px; }
    .contact-name { font-size: 15px; }
    .contact-handle { font-size: 11px; }
    .mini-btn { width: 32px; height: 32px; }
    .bottom-bar { flex-direction: column; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
