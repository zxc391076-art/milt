<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>milt — contacts</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#08080c;--bg-soft:#101018;--card:rgba(20,20,30,.7);--border:rgba(255,255,255,.08);--text:#f0f0f5;--muted:#8888a0;--accent:#a855f7;--accent-2:#22d3ee;--green:#22c55e;--red:#ef4444}
body.light{--bg:#f0f2f5;--bg-soft:#fff;--card:rgba(255,255,255,.8);--border:rgba(0,0,0,.08);--text:#14141a;--muted:#6b6b7a}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s}
.topbar{position:fixed;top:0;left:0;right:0;padding:20px 32px;display:flex;justify-content:space-between;align-items:center;z-index:10;backdrop-filter:blur(16px);background:linear-gradient(to bottom,var(--bg),transparent)}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:10px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.top-actions{display:flex;gap:10px;align-items:center}
.clock{font-family:'Space Mono',monospace;font-size:13px;font-weight:700;padding:8px 16px;border:1px solid var(--border);border-radius:999px;background:var(--bg-soft);display:flex;align-items:center;gap:8px}
.clock svg{width:14px;height:14px;fill:var(--accent-2)}
.clock .msk-label{font-size:10px;color:var(--muted);font-weight:400;margin-left:2px}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--bg-soft);border:1px solid var(--border);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.25s}
.icon-btn:hover{color:var(--text);transform:scale(1.05)}
.icon-btn svg{width:16px;height:16px;fill:currentColor}
.page{min-height:100vh;display:grid;grid-template-columns:1fr 1.1fr;max-width:1280px;margin:0 auto;padding:100px 48px 60px;gap:64px;align-items:center;position:relative;z-index:1}
.left{display:flex;flex-direction:column;align-items:flex-start;gap:28px}
.avatar-container{position:relative;width:150px;height:150px;animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.avatar-ring{position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,var(--accent),var(--accent-2),var(--accent),var(--accent));animation:spin 6s linear infinite;filter:blur(2px)}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar-inner{position:relative;width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:56px;color:#fff;overflow:hidden;cursor:pointer;background-size:cover;background-position:center;z-index:2;transition:transform .3s}
.avatar-inner:hover{transform:scale(1.03)}
.avatar-inner.has-image{font-size:0}
.avatar-overlay{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.7);display:grid;place-items:center;color:#fff;opacity:0;transition:opacity .25s;z-index:3;pointer-events:none}
.avatar-container:hover .avatar-overlay{opacity:1}
.avatar-overlay-content{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;font-weight:600}
.avatar-overlay svg{width:28px;height:28px;fill:#fff}
.online-dot{position:absolute;bottom:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--green);border:3px solid var(--bg);box-shadow:0 0 12px var(--green);z-index:4}
#avatarInput{display:none}
.avatar-reset{position:absolute;top:-6px;right:-6px;width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--muted);display:grid;place-items:center;cursor:pointer;z-index:5;transition:.25s;opacity:0;transform:scale(.8);pointer-events:none}
.avatar-container:hover .avatar-reset.active{opacity:1;transform:scale(1);pointer-events:auto}
.avatar-reset:hover{color:var(--red)}
.avatar-reset svg{width:14px;height:14px;fill:currentColor}
.greeting{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.greeting::before{content:'';width:24px;height:1px;background:var(--muted)}
.title{font-family:'Space Grotesk',sans-serif;font-size:clamp(48px,7vw,82px);font-weight:700;letter-spacing:-3px;line-height:.95;margin-top:-8px}
.title .highlight{background:linear-gradient(135deg,var(--accent),var(--accent-2),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-style:italic}
.description{font-size:15px;color:var(--muted);line-height:1.65;max-width:420px}
.status-pill{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;padding:8px 14px;border:1px solid var(--border);border-radius:999px;background:var(--bg-soft)}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 2s infinite}
.right{display:flex;flex-direction:column;gap:16px}
.section-label{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-weight:500;margin-bottom:4px}
.contact{position:relative;display:flex;align-items:center;gap:18px;padding:22px 24px;background:var(--card);border:1px solid var(--border);border-radius:20px;text-decoration:none;color:var(--text);transition:all .4s cubic-bezier(.22,1,.36,1);overflow:hidden}
.contact:hover{border-color:rgba(255,255,255,.2);transform:translateX(-6px);background:var(--bg-soft)}
.contact .icon-large{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex-shrink:0;z-index:2;transition:transform .4s}
.contact .icon-large svg{width:26px;height:26px;fill:#fff}
.contact.tg .icon-large{background:linear-gradient(135deg,#2AABEE,#22d3ee);box-shadow:0 8px 24px rgba(34,211,238,.4)}
.contact.ds .icon-large{background:linear-gradient(135deg,#5865F2,#a855f7);box-shadow:0 8px 24px rgba(168,85,247,.4)}
.contact:hover .icon-large{transform:rotate(-8deg) scale(1.08)}
.contact-info{flex:1;min-width:0;z-index:2}
.contact-name{font-size:17px;font-weight:600;margin-bottom:3px}
.contact-handle{font-family:'Space Mono',monospace;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contact-actions{display:flex;gap:6px;z-index:2}
.mini-btn{width:34px;height:34px;border-radius:10px;background:transparent;border:1px solid var(--border);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.2s;flex-shrink:0}
.mini-btn:hover{color:var(--text);background:rgba(127,127,127,.1);transform:scale(1.05)}
.mini-btn svg{width:15px;height:15px;fill:currentColor}
.mini-btn.copied{color:var(--green);border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.08)}
.contact .arrow{color:var(--muted);font-size:20px;transition:.3s;z-index:2}
.contact:hover .arrow{color:var(--text);transform:translateX(4px)}
.bottom-bar{display:flex;gap:10px;margin-top:8px}
.action-btn{flex:1;padding:14px;border-radius:14px;background:transparent;border:1px dashed var(--border);color:var(--muted);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.25s}
.action-btn:hover{color:var(--text);border-color:rgba(255,255,255,.2);background:var(--bg-soft);border-style:solid}
.action-btn svg{width:15px;height:15px;fill:currentColor}
.footer{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);letter-spacing:1.5px;opacity:.5;z-index:5;display:flex;gap:12px;text-transform:uppercase}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--green);color:#fff;padding:12px 22px;border-radius:12px;font-size:13.5px;font-weight:500;box-shadow:0 12px 32px rgba(0,0,0,.4);opacity:0;transition:all .4s;z-index:100;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:var(--red)}
@media(max-width:900px){.page{grid-template-columns:1fr;padding:90px 24px 60px;gap:40px;text-align:center}.left{align-items:center}.description{text-align:center}.title{font-size:clamp(42px,12vw,68px)}.avatar-container{width:130px;height:130px}.topbar{padding:16px 20px}.contact:hover{transform:translateY(-2px)}}
@media(max-width:440px){.clock .msk-label{display:none}.contact{padding:18px;gap:14px;border-radius:18px}.contact .icon-large{width:46px;height:46px}.contact .icon-large svg{width:22px;height:22px}.contact-name{font-size:15px}.contact-handle{font-size:11px}.bottom-bar{flex-direction:column}}
</style>
</head>
<body>

<div class="footer"><span>© milt</span><span>·</span><span>2026</span></div>
<div class="toast" id="toast">Скопировано!</div>

<script>
// Время МСК
function updateMSK(){
  var now = new Date();
  var utc = now.getTime() + now.getTimezoneOffset() * 60000;
  var msk = new Date(utc + 3 * 3600000);
  var p = function(n){ return String(n).padStart(2,'0'); };
  document.getElementById('mskTime').textContent = p(msk.getHours())+':'+p(msk.getMinutes())+':'+p(msk.getSeconds());
}
updateMSK();
setInterval(updateMSK, 1000);

// Toast
var toast = document.getElementById('toast');
var toastTimer;
function showToast(msg, isError){
  toast.textContent = msg;
  toast.classList.toggle('error', !!isError);
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2200);
}

// Копирование
document.querySelectorAll('.copy-btn').forEach(function(btn){
  btn.addEventListener('click', function(e){
    e.preventDefault(); e.stopPropagation();
    var text = btn.getAttribute('data-copy');
    navigator.clipboard.writeText(text).then(function(){
      btn.classList.add('copied');
      showToast('Скопировано: ' + text);
      setTimeout(function(){ btn.classList.remove('copied'); }, 1500);
    });
  });
});

// Поделиться
document.getElementById('shareBtn').addEventListener('click', function(){
  navigator.clipboard.writeText(window.location.href).then(function(){
    showToast('Ссылка скопирована!');
  });
});

// Тема
var themeBtn = document.getElementById('themeBtn');
var savedTheme = localStorage.getItem('milt-theme');
if(savedTheme === 'light') document.body.classList.add('light');
themeBtn.addEventListener('click', function(){
  document.body.classList.toggle('light');
  localStorage.setItem('milt-theme', document.body.classList.contains('light') ? 'light' : 'dark');
});

// Загрузка аватарки
var avatar = document.getElementById('avatar');
var avatarInput = document.getElementById('avatarInput');
var avatarContainer = document.getElementById('avatarContainer');
var avatarReset = document.getElementById('avatarReset');

// Восстановить сохранённую аватарку
var savedAvatar = localStorage.getItem('milt-avatar');
if(savedAvatar){
  avatar.style.backgroundImage = 'url(' + savedAvatar + ')';
  avatar.classList.add('has-image');
  avatarReset.classList.add('active');
}

// Клик по аватару -> открыть выбор файла
avatarContainer.addEventListener('click', function(e){
  if(e.target.closest('.avatar-reset')) return;
  avatarInput.click();
});

// Выбор файла
avatarInput.addEventListener('change', function(){
  var file = this.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    var dataUrl = ev.target.result;
    avatar.style.backgroundImage = 'url(' + dataUrl + ')';
    avatar.classList.add('has-image');
    avatarReset.classList.add('active');
    try { localStorage.setItem('milt-avatar', dataUrl); } catch(err){}
  };
  reader.readAsDataURL(file);
});

// Сброс аватарки
avatarReset.addEventListener('click', function(e){
  e.stopPropagation();
  avatar.style.backgroundImage = '';
  avatar.classList.remove('has-image');
  avatarReset.classList.remove('active');
  localStorage.removeItem('milt-avatar');
  avatarInput.value = '';
});
</script>

</body>
</html>
